[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tritanc"
version = "1.0.0"
description = "Taxonomy-aware metagenomic contig clustering pipeline"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "biopython",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "networkx>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow",
    "scipy>=1.10",
    "statsmodels>=0.14",
]

[project.scripts]
tritanc = "tritanc.cli:main"

[tool.setuptools.packages.find]
include = ["tritanc*"]
